<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>UR5e — Real vs Imaginação do World Model</title>
<style>
  body{margin:0;background:#0b0e14;color:#e6edf3;font:14px system-ui,Segoe UI,sans-serif;
       display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}
  h2{margin:12px 0 6px;font-size:16px;font-weight:600}
  #view{display:block;border-radius:12px;border:1px solid #26303f;margin-top:4px;
        width:min(94vw,1000px);cursor:crosshair}
  #ctrls{margin-top:12px;display:flex;gap:18px;align-items:center;background:rgba(10,14,20,.72);
         padding:8px 16px;border-radius:10px;border:1px solid #26303f}
  #ctrls b{font-variant-numeric:tabular-nums}
  button{background:#1c2a3f;color:#e6edf3;border:1px solid #33465f;border-radius:8px;
         padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{background:#243449}
  input[type=range]{width:150px}
  .g{color:#78f5aa}
</style>
</head>
<body>
<h2>🧠 UR5e — <span style="color:#cfd8e3">mundo real</span> vs <span class="g">imaginação do world model</span></h2>
<img id="view" alt="UR5e"/>
<div id="ctrls">
  <span>Distância: <b id="dist">—</b></span>
  <span>Estado: <b id="status" style="color:#ffd166">—</b></span>
  <span>|&nbsp; Altura Z: <b id="zval">0.50</b></span>
  <input id="z" type="range" min="0.15" max="0.75" step="0.01" value="0.50"/>
  <button id="rand">🎲 Sortear alvo</button>
  <span style="color:#8b98a9">clique no braço da ESQUERDA pra posicionar</span>
</div>

<script>
const view = document.getElementById('view');
const LEFT_FRAC = 460 / (460*2 + 6);   // left panel share of the combined width
let ws;
function send(o){ if(ws && ws.readyState===1) ws.send(JSON.stringify(o)); }
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if(m.img) view.src = 'data:image/jpeg;base64,' + m.img;
    if(m.dist!=null) document.getElementById('dist').textContent = m.dist.toFixed(3)+' m';
    const st = document.getElementById('status');
    if(m.reached){ st.textContent='alcançou ✓'; st.style.color='#3ddc84'; }
    else { st.textContent='indo...'; st.style.color='#ffd166'; }
  };
  ws.onopen = ()=> send({z: parseFloat(document.getElementById('z').value)});
  ws.onclose = ()=> setTimeout(connect, 800);
}
connect();

view.addEventListener('click', e => {
  const r = view.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width;      // 0..1 across the whole combo
  const fy = (e.clientY - r.top) / r.height;
  if(fx > LEFT_FRAC) return;                       // only the real (left) panel is clickable
  send({click:[fx / LEFT_FRAC, fy]});
});
document.getElementById('z').addEventListener('input', e=>{
  document.getElementById('zval').textContent = parseFloat(e.target.value).toFixed(2);
  send({z: parseFloat(e.target.value)});
});
document.getElementById('rand').addEventListener('click', ()=> send({random:true}));
</script>
</body>
</html>
